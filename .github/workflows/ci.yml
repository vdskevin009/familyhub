name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck React app and local worker
        run: npm run typecheck
      - name: Verify browser shard coverage
        run: node --test tests/ci-browser-shard.test.mjs
      - name: Build React PWA and local worker once
        env:
          VITE_MAIL_RETRIEVAL_MODE: plugin-only
        run: npm run build
      - name: Prepare exact tested Pages contents
        run: |
          touch apps/web/dist/.nojekyll
          cp apps/web/dist/index.html apps/web/dist/404.html
          find apps/web/dist apps/worker/dist -type f -print0 | sort -z | xargs -0 sha256sum > build.sha256
          printf '%s\n' "$GITHUB_SHA" > build.revision
          tar -cf tested-build.tar apps/web/dist apps/worker/dist build.sha256 build.revision
      - name: Record immutable artifact name
        id: identity
        run: echo 'artifact_name=tested-build-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: tested-build.tar
          if-no-files-found: error
          retention-days: 2

  unit:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.compile.outputs.artifact_name }}
      - name: Verify same-run build identity and contents
        run: |
          tar -xf tested-build.tar
          test "$(cat build.revision)" = "$GITHUB_SHA"
          sha256sum --check build.sha256
      - name: Verify property evidence and private intake
        run: npm run test:properties && npm run test:vehicles
      - name: Verify PWA installability metadata
        run: npm run test:pwa
      - name: Verify authoritative opportunity calculations
        run: npm run test:opportunities
      - name: Verify Savings calculations and privacy
        run: npm run test:savings
      - name: Verify Mortgage evidence, calculations and authenticated persistence
        run: npm run test:mortgage
      - name: Verify private finance imports, calculations and authorization
        run: npm run test:finances
      - name: Verify notification evidence, privacy, deduplication and authorization
        run: npm run test:notifications
      - name: Verify Courses persistence, pricing and privacy
        run: npm run test:groceries
      - name: Install Chromium for invoice history regression fixtures
        run: npx playwright install --with-deps chromium
      - name: Verify invoice collection and worker authorization
        run: npm run test:invoices
      - name: Verify synthetic claim preparation safeguards
        run: npm run test:claims:readiness && npm run test:claims

  browser:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.compile.outputs.artifact_name }}
      - name: Verify same-run build identity and contents
        run: |
          tar -xf tested-build.tar
          test "$(cat build.revision)" = "$GITHUB_SHA"
          sha256sum --check build.sha256
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run complete browser acceptance shard
        env:
          CARD_RENDER_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-browser-shard.mjs ${{ matrix.shard }} 4
      - name: Confirm browser tests did not alter the tested build
        run: sha256sum --check build.sha256
      - name: Upload synthetic evidence from this shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            artifacts/proactive/
            artifacts/theme/
            artifacts/mortgage-assistant/
            artifacts/groceries/
            artifacts/theme-savings/
            output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'
      - name: Run retained domain regression tests
        run: dotnet run --project tests/Core.Tests -c Release

  # Keep the existing required check name. A failed/skipped/cancelled prerequisite
  # must fail this gate, not produce a successful skipped deployment prerequisite.
  build:
    if: always()
    needs: [compile, unit, browser, domain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          COMPILE: ${{ needs.compile.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          DOMAIN: ${{ needs.domain.result }}
        run: |
          test "$COMPILE" = success
          test "$UNIT" = success
          test "$BROWSER" = success
          test "$DOMAIN" = success
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: ${{ needs.compile.outputs.artifact_name }}
      - name: Verify exact tested artifact before publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tar -xf tested-build.tar
          test "$(cat build.revision)" = "$GITHUB_SHA"
          sha256sum --check build.sha256
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
