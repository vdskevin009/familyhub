name: PWA published verification (isolated)
on:
  push:
    branches: [chore/pwa-108-audit-snapshot]
    paths: [.github/workflows/pwa-audit-snapshot.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 762ef11221f4e752d6b7e597255483fa1b5781a2
          persist-credentials: false
      - name: Wait for the exact main deployment to finish successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh api repos/vdskevin009/familyhub/actions/runs/36725973447 --jq '.status + ":" + (.conclusion // "")')
            echo "$state"
            if [ "$state" = 'completed:success' ]; then exit 0; fi
            if [[ "$state" == completed:* ]]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify live Pages UI without using real household data or the PC worker
        run: |
          mkdir -p evidence
          python apps/web/tests/browser_smoke.py --url https://vdskevin009.github.io/familyhub/ --output evidence
          printf '%s\n' 'Deployed source: 762ef11221f4e752d6b7e597255483fa1b5781a2' 'PR: #109' 'Main build/test/deploy: 36725973447' > evidence/release.txt
      - name: Upload synthetic deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-published-verification
          path: evidence
          retention-days: 7
